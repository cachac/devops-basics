<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba de Integración Continua en AzureDevops</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #06141f;
      --card: rgba(255,255,255,.08);
      --text: #ffffff;
      --muted: rgba(255,255,255,.75);

      --blue: #4f8cff;
      --purple: #8b5cf6;
      --cyan: #22d3ee;
      --green: #34d399;
      --pink: #ec4899;
    }

    body {
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Background grid pattern */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 95%);
      z-index: 0;
    }

    /* Aurora / Northern Lights */
    .aurora {
      position: absolute;
      inset: -20%;
      filter: blur(90px);
      opacity: .75;
      z-index: 0;
      animation: float 14s ease-in-out infinite alternate;
    }

    .aurora::before,
    .aurora::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .aurora::before {
      width: 600px;
      height: 600px;
      top: 5%;
      left: 10%;
      background: radial-gradient(circle,
          rgba(52,211,153,.7),
          rgba(34,211,238,.45),
          transparent 70%);
    }

    .aurora::after {
      width: 700px;
      height: 700px;
      bottom: 0;
      right: 5%;
      background: radial-gradient(circle,
          rgba(139,92,246,.7),
          rgba(236,72,153,.45),
          transparent 70%);
    }

    @keyframes float {
      from {
        transform: translate(-40px,-20px) rotate(0deg);
      }
      to {
        transform: translate(40px,30px) rotate(12deg);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(90%, 900px);
      text-align: center;

      padding: 60px 40px;

      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;

      box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.15);
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: .85rem;
      letter-spacing: .08em;
      text-transform: uppercase;

      background: linear-gradient(90deg,
          var(--cyan),
          var(--blue),
          var(--purple));
      color: white;
      margin-bottom: 30px;

      box-shadow: 0 8px 25px rgba(79,140,255,.35);
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.15;

      background: linear-gradient(
          90deg,
          #ffffff,
          #b8f3ff,
          #d7c4ff,
          #ffffff
      );
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: shine 8s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 300%;
      }
    }

    h2 {
      margin-top: 22px;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      color: var(--muted);
      font-weight: 400;
    }

    .highlight {
      font-weight: 700;
      background: linear-gradient(
        90deg,
        var(--green),
        var(--cyan),
        var(--blue)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .line {
      width: 140px;
      height: 5px;
      margin: 40px auto 0;
      border-radius: 999px;

      background: linear-gradient(
        90deg,
        var(--green),
        var(--cyan),
        var(--blue),
        var(--purple),
        var(--pink)
      );
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .container {
        padding: 40px 25px;
        border-radius: 22px;
      }

      .badge {
        font-size: .75rem;
      }
    }
  </style>
</head>

<body>

  <div class="aurora"></div>

  <main class="container">
    <div class="badge">Azure DevOps • CI</div>

    <h1>Prueba de Integración Continua en AzureDevops</h1>

    <h2>
      Created by
      <span class="highlight">&lt;STUDENT_NAME&gt;</span>
    </h2>

    <div class="line"></div>
  </main>

</body>
</html>
